<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#e8d5a3;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond carré arrondi -->
  <rect x="12" y="12" width="176" height="176" rx="20" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="20" y="20" width="160" height="160" rx="15" fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.2"/>

  <!-- Nœud gauche -->
  <circle cx="52" cy="100" r="18" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="52" cy="100" r="8" fill="url(#g1)" filter="url(#glow)"/>

  <!-- Nœud droit -->
  <circle cx="148" cy="100" r="18" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="148" cy="100" r="8" fill="url(#g1)" filter="url(#glow)"/>

  <!-- Nœud central haut -->
  <circle cx="100" cy="58" r="14" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="100" cy="58" r="6" fill="url(#g1)" opacity="0.7"/>

  <!-- Nœud central bas -->
  <circle cx="100" cy="142" r="14" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="100" cy="142" r="6" fill="url(#g1)" opacity="0.7"/>

  <!-- Connexions -->
  <line x1="70" y1="100" x2="130" y2="100" stroke="url(#g2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="88" x2="90" y2="65" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="135" y1="88" x2="110" y2="65" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="65" y1="112" x2="90" y2="135" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="135" y1="112" x2="110" y2="135" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Points de connexion sur les lignes -->
  <circle cx="100" cy="100" r="5" fill="url(#g1)" filter="url(#glow)"/>

  <!-- Petits points décoratifs sur les lignes -->
  <circle cx="80" cy="100" r="2" fill="url(#g1)" opacity="0.5"/>
  <circle cx="120" cy="100" r="2" fill="url(#g1)" opacity="0.5"/>

  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="url(#g1)" opacity="0.55" letter-spacing="4">n8n</text>
</svg>
