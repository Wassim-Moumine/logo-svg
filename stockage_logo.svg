<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond transparent -->

  <!-- Disque bas (ombre profondeur) -->
  <ellipse cx="100" cy="148" rx="58" ry="14" fill="#080808" opacity="0.6"/>

  <!-- Corps cylindre — face avant -->
  <rect x="42" y="72" width="116" height="72" rx="4" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Reflet haut cylindre -->
  <rect x="42" y="72" width="116" height="18" rx="4" fill="url(#goldGrad2)" opacity="0.08"/>

  <!-- Ellipse haut cylindre -->
  <ellipse cx="100" cy="72" rx="58" ry="14" fill="#0e0e0e" stroke="url(#goldGrad)" stroke-width="1" filter="url(#glow)"/>

  <!-- Ellipse milieu (séparation) -->
  <ellipse cx="100" cy="108" rx="58" ry="14" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>

  <!-- Ellipse bas cylindre -->
  <ellipse cx="100" cy="144" rx="58" ry="14" fill="#0e0e0e" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Ligne déco verticale gauche -->
  <line x1="42" y1="72" x2="42" y2="144" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  <!-- Ligne déco verticale droite -->
  <line x1="158" y1="72" x2="158" y2="144" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- LED / indicateur -->
  <circle cx="130" cy="108" r="4" fill="#c9a84c" opacity="0.8" filter="url(#glow)"/>
  <circle cx="143" cy="108" r="4" fill="#c9a84c" opacity="0.4"/>

  <!-- Trait déco horizontal bas -->
  <line x1="55" y1="130" x2="120" y2="130" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>

  <!-- Deuxième disque empilé (haut) -->
  <ellipse cx="100" cy="58" rx="58" ry="14" fill="#0e0e0e" stroke="url(#goldGrad)" stroke-width="1" filter="url(#glow)"/>
  <rect x="42" y="44" width="116" height="16" rx="0" fill="#0a0a0a" stroke="none"/>
  <line x1="42" y1="44" x2="42" y2="58" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="158" y1="44" x2="158" y2="58" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  <ellipse cx="100" cy="44" rx="58" ry="14" fill="#0e0e0e" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- LED disque haut -->
  <circle cx="130" cy="51" r="3" fill="#c9a84c" opacity="0.6" filter="url(#glow)"/>
  <circle cx="141" cy="51" r="3" fill="#c9a84c" opacity="0.3"/>

  <!-- Troisième disque (tout en haut) -->
  <ellipse cx="100" cy="30" rx="58" ry="14" fill="#0e0e0e" stroke="url(#goldGrad)" stroke-width="1" filter="url(#glow)"/>
  <rect x="42" y="18" width="116" height="14" rx="0" fill="#0a0a0a" stroke="none"/>
  <line x1="42" y1="18" x2="42" y2="30" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="158" y1="18" x2="158" y2="30" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  <ellipse cx="100" cy="18" rx="58" ry="14" fill="#0e0e0e" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- LED disque top -->
  <circle cx="130" cy="24" r="3" fill="#c9a84c" opacity="0.9" filter="url(#glow)"/>
  <circle cx="141" cy="24" r="3" fill="#c9a84c" opacity="0.5"/>

  <!-- Losange déco coin bas droit -->
  <polygon points="172,155 178,161 172,167 166,161" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
  <!-- Losange déco coin haut gauche -->
  <polygon points="28,28 34,22 40,28 34,34" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.3"/>

  <!-- Points décoratifs -->
  <circle cx="100" cy="180" r="1.5" fill="#c9a84c" opacity="0.4"/>
  <circle cx="112" cy="180" r="1" fill="#c9a84c" opacity="0.25"/>
  <circle cx="88" cy="180" r="1" fill="#c9a84c" opacity="0.25"/>
</svg>
