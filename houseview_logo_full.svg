<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- DIAMOND ICON -->
  <!-- Outer ring -->
  <polygon points="52,4 98,50 52,96 6,50" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.35"/>
  <!-- Main diamond -->
  <polygon points="52,14 88,50 52,86 16,50" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Inner cut -->
  <polygon points="52,28 74,50 52,72 30,50" fill="#080808"/>
  <!-- Center gem -->
  <polygon points="52,36 66,50 52,64 38,50" fill="url(#goldGrad2)"/>
  <!-- Tiny center -->
  <polygon points="52,44 58,50 52,56 46,50" fill="#080808"/>
  <!-- Corner dots -->
  <circle cx="52" cy="5" r="1.5" fill="#c9a84c" opacity="0.7"/>
  <circle cx="97" cy="50" r="1.5" fill="#c9a84c" opacity="0.7"/>
  <circle cx="52" cy="95" r="1.5" fill="#c9a84c" opacity="0.7"/>
  <circle cx="7" cy="50" r="1.5" fill="#c9a84c" opacity="0.7"/>

  <!-- Séparateur vertical -->
  <line x1="116" y1="20" x2="116" y2="80" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>

  <!-- TEXTE "House" -->
  <text
    x="132" y="52"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="400"
    fill="url(#goldGrad)"
    letter-spacing="1"
  >House</text>

  <!-- TEXTE "View" en italic -->
  <text
    x="132" y="82"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="300"
    font-style="italic"
    fill="#c9a84c"
    opacity="0.75"
    letter-spacing="3"
  >View</text>

  <!-- Ligne décorative sous le texte -->
  <line x1="132" y1="90" x2="310" y2="90" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>

  <!-- Point décoratif -->
  <circle cx="132" cy="90" r="1.5" fill="#c9a84c" opacity="0.5"/>
  <circle cx="310" cy="90" r="1.5" fill="#c9a84c" opacity="0.5"/>
</svg>
