<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Boîtier NAS principal -->
  <rect x="40" y="30" width="120" height="145" rx="8" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="47" y="37" width="106" height="131" rx="5" fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.2"/>

  <!-- Slot disque 1 -->
  <rect x="52" y="48" width="96" height="28" rx="4" fill="#0e0e0e" stroke="url(#g1)" stroke-width="1" opacity="0.8"/>
  <rect x="56" y="55" width="60" height="14" rx="2" fill="#0a0a0a" stroke="url(#g1)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="136" cy="62" r="5" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1"/>
  <circle cx="136" cy="62" r="2" fill="url(#g1)" opacity="0.6" filter="url(#glow)"/>

  <!-- Slot disque 2 -->
  <rect x="52" y="84" width="96" height="28" rx="4" fill="#0e0e0e" stroke="url(#g1)" stroke-width="1" opacity="0.8"/>
  <rect x="56" y="91" width="60" height="14" rx="2" fill="#0a0a0a" stroke="url(#g1)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="136" cy="98" r="5" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1"/>
  <circle cx="136" cy="98" r="2" fill="url(#g1)" opacity="0.8" filter="url(#glow)"/>

  <!-- Slot disque 3 -->
  <rect x="52" y="120" width="96" height="28" rx="4" fill="#0e0e0e" stroke="url(#g1)" stroke-width="1" opacity="0.6"/>
  <rect x="56" y="127" width="60" height="14" rx="2" fill="#0a0a0a" stroke="url(#g1)" stroke-width="0.5" opacity="0.3"/>
  <circle cx="136" cy="134" r="5" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1" opacity="0.5"/>
  <circle cx="136" cy="134" r="2" fill="url(#g1)" opacity="0.3"/>

  <!-- Panneau bas -->
  <rect x="52" y="156" width="96" height="12" rx="3" fill="#0e0e0e" stroke="url(#g1)" stroke-width="0.5" opacity="0.4"/>
  <!-- Ports USB -->
  <rect x="58" y="159" width="8" height="6" rx="1" fill="url(#g1)" opacity="0.5"/>
  <rect x="70" y="159" width="8" height="6" rx="1" fill="url(#g1)" opacity="0.3"/>
  <!-- Power LED -->
  <circle cx="130" cy="162" r="3" fill="url(#g1)" filter="url(#glow)" opacity="0.9"/>

  <!-- Label NAS -->
  <text x="100" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="url(#g1)" opacity="0.6" letter-spacing="3">NAS</text>
</svg>
