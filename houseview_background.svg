<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#080808;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030303;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.03" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0" />
    </radialGradient>

    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- FOND PRINCIPAL -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- HALOS LUMINEUX -->
  <rect width="1920" height="1080" fill="url(#glowLeft)"/>
  <rect width="1920" height="1080" fill="url(#glowRight)"/>
  <rect width="1920" height="1080" fill="url(#glowCenter)"/>

  <!-- ===== MOTIF GÉOMÉTRIQUE ISLAMIQUE — FOND ===== -->
  <!-- Grille de losanges répétés en fond très subtil -->
  <g opacity="0.025" stroke="#c9a84c" stroke-width="0.5" fill="none">
    <!-- Rangée 1 -->
    <polygon points="96,0 192,96 96,192 0,96"/>
    <polygon points="288,0 384,96 288,192 192,96"/>
    <polygon points="480,0 576,96 480,192 384,96"/>
    <polygon points="672,0 768,96 672,192 576,96"/>
    <polygon points="864,0 960,96 864,192 768,96"/>
    <polygon points="1056,0 1152,96 1056,192 960,96"/>
    <polygon points="1248,0 1344,96 1248,192 1152,96"/>
    <polygon points="1440,0 1536,96 1440,192 1344,96"/>
    <polygon points="1632,0 1728,96 1632,192 1536,96"/>
    <polygon points="1824,0 1920,96 1824,192 1728,96"/>
    <!-- Rangée 2 décalée -->
    <polygon points="0,192 96,288 0,384 -96,288"/>
    <polygon points="192,192 288,288 192,384 96,288"/>
    <polygon points="384,192 480,288 384,384 288,288"/>
    <polygon points="576,192 672,288 576,384 480,288"/>
    <polygon points="768,192 864,288 768,384 672,288"/>
    <polygon points="960,192 1056,288 960,384 864,288"/>
    <polygon points="1152,192 1248,288 1152,384 1056,288"/>
    <polygon points="1344,192 1440,288 1344,384 1248,288"/>
    <polygon points="1536,192 1632,288 1536,384 1440,288"/>
    <polygon points="1728,192 1824,288 1728,384 1632,288"/>
    <polygon points="1920,192 2016,288 1920,384 1824,288"/>
    <!-- Rangée 3 -->
    <polygon points="96,384 192,480 96,576 0,480"/>
    <polygon points="288,384 384,480 288,576 192,480"/>
    <polygon points="480,384 576,480 480,576 384,480"/>
    <polygon points="672,384 768,480 672,576 576,480"/>
    <polygon points="864,384 960,480 864,576 768,480"/>
    <polygon points="1056,384 1152,480 1056,576 960,480"/>
    <polygon points="1248,384 1344,480 1248,576 1152,480"/>
    <polygon points="1440,384 1536,480 1440,576 1344,480"/>
    <polygon points="1632,384 1728,480 1632,576 1536,480"/>
    <polygon points="1824,384 1920,480 1824,576 1728,480"/>
    <!-- Rangée 4 décalée -->
    <polygon points="192,576 288,672 192,768 96,672"/>
    <polygon points="384,576 480,672 384,768 288,672"/>
    <polygon points="576,576 672,672 576,768 480,672"/>
    <polygon points="768,576 864,672 768,768 672,672"/>
    <polygon points="960,576 1056,672 960,768 864,672"/>
    <polygon points="1152,576 1248,672 1152,768 1056,672"/>
    <polygon points="1344,576 1440,672 1344,768 1248,672"/>
    <polygon points="1536,576 1632,672 1536,768 1440,672"/>
    <polygon points="1728,576 1824,672 1728,768 1632,672"/>
    <!-- Rangée 5 -->
    <polygon points="96,768 192,864 96,960 0,864"/>
    <polygon points="288,768 384,864 288,960 192,864"/>
    <polygon points="480,768 576,864 480,960 384,864"/>
    <polygon points="672,768 768,864 672,960 576,864"/>
    <polygon points="864,768 960,864 864,960 768,864"/>
    <polygon points="1056,768 1152,864 1056,960 960,864"/>
    <polygon points="1248,768 1344,864 1248,960 1152,864"/>
    <polygon points="1440,768 1536,864 1440,960 1344,864"/>
    <polygon points="1632,768 1728,864 1632,960 1536,864"/>
    <polygon points="1824,768 1920,864 1824,960 1728,864"/>
  </g>

  <!-- ===== GRAND DIAMANT DÉCORATIF GAUCHE ===== -->
  <g opacity="0.07" filter="url(#blur1)">
    <polygon points="180,200 380,400 180,600 -20,400" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <polygon points="180,240 340,400 180,560 20,400" fill="none" stroke="#c9a84c" stroke-width="0.5"/>
    <polygon points="180,280 300,400 180,520 60,400" fill="none" stroke="#c9a84c" stroke-width="0.5"/>
  </g>

  <!-- ===== GRAND DIAMANT DÉCORATIF DROIT ===== -->
  <g opacity="0.07" filter="url(#blur1)">
    <polygon points="1740,480 1940,680 1740,880 1540,680" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <polygon points="1740,520 1900,680 1740,840 1580,680" fill="none" stroke="#c9a84c" stroke-width="0.5"/>
    <polygon points="1740,560 1860,680 1740,800 1620,680" fill="none" stroke="#c9a84c" stroke-width="0.5"/>
  </g>

  <!-- ===== ÉTOILE ISLAMIQUE 8 BRANCHES — GAUCHE ===== -->
  <g transform="translate(200, 850)" opacity="0.08" fill="none" stroke="#c9a84c" stroke-width="0.8">
    <polygon points="0,-80 20,-20 80,0 20,20 0,80 -20,20 -80,0 -20,-20"/>
    <polygon points="0,-60 15,-15 60,0 15,15 0,60 -15,15 -60,0 -15,-15"/>
    <circle cx="0" cy="0" r="80" stroke-width="0.3" opacity="0.5"/>
    <circle cx="0" cy="0" r="40" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- ===== ÉTOILE ISLAMIQUE 8 BRANCHES — DROITE ===== -->
  <g transform="translate(1720, 200)" opacity="0.08" fill="none" stroke="#c9a84c" stroke-width="0.8">
    <polygon points="0,-80 20,-20 80,0 20,20 0,80 -20,20 -80,0 -20,-20"/>
    <polygon points="0,-60 15,-15 60,0 15,15 0,60 -15,15 -60,0 -15,-15"/>
    <circle cx="0" cy="0" r="80" stroke-width="0.3" opacity="0.5"/>
    <circle cx="0" cy="0" r="40" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- ===== LIGNES HORIZONTALES FINES — STYLE ROUTE ===== -->
  <g opacity="0.04" stroke="#c9a84c" stroke-width="0.5">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
  </g>

  <!-- ===== LIGNES VERTICALES FINES ===== -->
  <g opacity="0.03" stroke="#c9a84c" stroke-width="0.5">
    <line x1="384" y1="0" x2="384" y2="1080"/>
    <line x1="768" y1="0" x2="768" y2="1080"/>
    <line x1="1152" y1="0" x2="1152" y2="1080"/>
    <line x1="1536" y1="0" x2="1536" y2="1080"/>
  </g>

  <!-- ===== PARTICULES / ÉTOILES ===== -->
  <g fill="#c9a84c">
    <!-- Petites étoiles dispersées -->
    <circle cx="120" cy="150" r="1" opacity="0.4"/>
    <circle cx="350" cy="80" r="0.8" opacity="0.3"/>
    <circle cx="580" cy="200" r="1.2" opacity="0.35"/>
    <circle cx="820" cy="60" r="0.8" opacity="0.25"/>
    <circle cx="1050" cy="170" r="1" opacity="0.3"/>
    <circle cx="1280" cy="90" r="1.2" opacity="0.35"/>
    <circle cx="1500" cy="140" r="0.8" opacity="0.25"/>
    <circle cx="1750" cy="70" r="1" opacity="0.3"/>
    <circle cx="1880" cy="180" r="0.8" opacity="0.2"/>
    <circle cx="200" cy="450" r="0.8" opacity="0.2"/>
    <circle cx="450" cy="520" r="1" opacity="0.25"/>
    <circle cx="700" cy="380" r="0.8" opacity="0.2"/>
    <circle cx="1600" cy="500" r="1" opacity="0.25"/>
    <circle cx="1850" cy="420" r="0.8" opacity="0.2"/>
    <circle cx="100" cy="700" r="1" opacity="0.3"/>
    <circle cx="400" cy="780" r="0.8" opacity="0.2"/>
    <circle cx="650" cy="650" r="1.2" opacity="0.25"/>
    <circle cx="1300" cy="720" r="0.8" opacity="0.2"/>
    <circle cx="1650" cy="800" r="1" opacity="0.25"/>
    <circle cx="1900" cy="650" r="0.8" opacity="0.2"/>
    <circle cx="250" cy="980" r="1" opacity="0.3"/>
    <circle cx="750" cy="1020" r="0.8" opacity="0.2"/>
    <circle cx="1100" cy="950" r="1.2" opacity="0.25"/>
    <circle cx="1450" cy="1000" r="0.8" opacity="0.2"/>
    <circle cx="1800" cy="960" r="1" opacity="0.25"/>
    <!-- Losanges décoratifs subtils -->
    <polygon points="960,30 966,36 960,42 954,36" opacity="0.3"/>
    <polygon points="300,540 306,546 300,552 294,546" opacity="0.2"/>
    <polygon points="1620,540 1626,546 1620,552 1614,546" opacity="0.2"/>
    <polygon points="960,1050 966,1056 960,1062 954,1056" opacity="0.2"/>
  </g>

  <!-- ===== LIGNES DIAGONALES COIN BAS GAUCHE ===== -->
  <g opacity="0.04" stroke="#c9a84c" stroke-width="0.5">
    <line x1="0" y1="880" x2="200" y2="1080"/>
    <line x1="0" y1="960" x2="120" y2="1080"/>
    <line x1="0" y1="1000" x2="80" y2="1080"/>
    <line x1="80" y1="880" x2="280" y2="1080"/>
    <line x1="160" y1="880" x2="360" y2="1080"/>
  </g>

  <!-- ===== LIGNES DIAGONALES COIN HAUT DROIT ===== -->
  <g opacity="0.04" stroke="#c9a84c" stroke-width="0.5">
    <line x1="1720" y1="0" x2="1920" y2="200"/>
    <line x1="1800" y1="0" x2="1920" y2="120"/>
    <line x1="1840" y1="0" x2="1920" y2="80"/>
    <line x1="1640" y1="0" x2="1920" y2="280"/>
    <line x1="1560" y1="0" x2="1920" y2="360"/>
  </g>

  <!-- ===== BORDURE DORÉE SUBTILE ===== -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.08"/>
  <rect x="30" y="30" width="1860" height="1020" fill="none" stroke="#c9a84c" stroke-width="0.3" opacity="0.04"/>

  <!-- ===== COINS DÉCORATIFS ===== -->
  <!-- Coin haut gauche -->
  <g transform="translate(20,20)" opacity="0.2" fill="none" stroke="#c9a84c" stroke-width="1">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="60"/>
    <polygon points="12,12 24,12 18,6" fill="#c9a84c" opacity="0.4"/>
  </g>
  <!-- Coin haut droit -->
  <g transform="translate(1900,20)" opacity="0.2" fill="none" stroke="#c9a84c" stroke-width="1">
    <line x1="0" y1="0" x2="-60" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="60"/>
    <polygon points="-12,12 -24,12 -18,6" fill="#c9a84c" opacity="0.4"/>
  </g>
  <!-- Coin bas gauche -->
  <g transform="translate(20,1060)" opacity="0.2" fill="none" stroke="#c9a84c" stroke-width="1">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="-60"/>
    <polygon points="12,-12 24,-12 18,-6" fill="#c9a84c" opacity="0.4"/>
  </g>
  <!-- Coin bas droit -->
  <g transform="translate(1900,1060)" opacity="0.2" fill="none" stroke="#c9a84c" stroke-width="1">
    <line x1="0" y1="0" x2="-60" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="-60"/>
    <polygon points="-12,-12 -24,-12 -18,-6" fill="#c9a84c" opacity="0.4"/>
  </g>

  <!-- ===== GRAND DIAMANT CENTRAL TRÈS SUBTIL ===== -->
  <g opacity="0.025" filter="url(#blur2)">
    <polygon points="960,200 1360,540 960,880 560,540" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <polygon points="960,260 1300,540 960,820 620,540" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <polygon points="960,320 1240,540 960,760 680,540" fill="none" stroke="#c9a84c" stroke-width="0.5"/>
  </g>

</svg>
