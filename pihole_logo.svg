<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cercle principal - bouclier -->
  <circle cx="100" cy="90" r="72" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="100" cy="90" r="62" fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.25"/>

  <!-- Trou noir central (black hole DNS) -->
  <circle cx="100" cy="90" r="28" fill="#050505" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="100" cy="90" r="18" fill="#030303" stroke="url(#g1)" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="90" r="8" fill="url(#g1)" filter="url(#glow)"/>

  <!-- Orbites DNS (paquets bloqués) -->
  <ellipse cx="100" cy="90" rx="48" ry="16" fill="none" stroke="url(#g1)" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" transform="rotate(-30 100 90)"/>
  <ellipse cx="100" cy="90" rx="48" ry="16" fill="none" stroke="url(#g1)" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.3" transform="rotate(30 100 90)"/>

  <!-- Particules bloquées sur les orbites -->
  <circle cx="148" cy="90" r="3" fill="url(#g1)" opacity="0.7" filter="url(#glow)"/>
  <circle cx="55" cy="75" r="2.5" fill="url(#g1)" opacity="0.5"/>
  <circle cx="138" cy="112" r="2" fill="url(#g1)" opacity="0.4"/>

  <!-- Croix de blocage -->
  <line x1="90" y1="80" x2="110" y2="100" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="110" y1="80" x2="90" y2="100" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="url(#g1)" opacity="0.55" letter-spacing="2">PI-HOLE</text>
</svg>
