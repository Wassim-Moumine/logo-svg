<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond hexagonal -->
  <polygon points="100,12 168,52 168,132 100,172 32,132 32,52"
    fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <polygon points="100,22 158,58 158,126 100,162 42,126 42,58"
    fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.3"/>

  <!-- Lettre P stylisée -->
  <rect x="68" y="62" width="12" height="60" rx="2" fill="url(#g1)" filter="url(#glow)"/>
  <!-- Arc du P -->
  <path d="M80 62 Q120 62 120 82 Q120 102 80 102" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Croix Proxmox en bas à droite -->
  <line x1="118" y1="108" x2="142" y2="108" stroke="url(#g1)" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="96" x2="130" y2="120" stroke="url(#g1)" stroke-width="4" stroke-linecap="round"/>

  <!-- Points déco coins -->
  <circle cx="100" cy="12" r="3" fill="url(#g1)" opacity="0.6"/>
  <circle cx="100" cy="172" r="2" fill="url(#g1)" opacity="0.4"/>
</svg>
