<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e8d5a3;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond carré arrondi -->
  <rect x="15" y="15" width="170" height="170" rx="16" fill="#0a0a0a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="22" y="22" width="156" height="156" rx="12" fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.25"/>

  <!-- Flèches de routing - entrées à gauche -->
  <line x1="30" y1="70" x2="72" y2="70" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="100" x2="72" y2="100" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="130" x2="72" y2="130" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nœud central -->
  <circle cx="100" cy="100" r="20" fill="#0a0a0a" stroke="url(#g1)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="8" fill="url(#g1)" filter="url(#glow)"/>

  <!-- Lignes entrées vers nœud -->
  <line x1="72" y1="70" x2="84" y2="90" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="72" y1="100" x2="80" y2="100" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="72" y1="130" x2="84" y2="110" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Sorties du nœud -->
  <line x1="116" y1="90" x2="140" y2="65" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="140,65 132,64 138,72" fill="url(#g1)"/>

  <line x1="120" y1="100" x2="170" y2="100" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="170,100 162,96 162,104" fill="url(#g1)"/>

  <line x1="116" y1="110" x2="140" y2="135" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="140,135 132,128 140,127" fill="url(#g1)"/>
</svg>
