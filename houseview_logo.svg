<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer diamond -->
  <polygon
    points="100,8 192,100 100,192 8,100"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="1.5"
    opacity="0.4"
  />

  <!-- Middle diamond -->
  <polygon
    points="100,22 178,100 100,178 22,100"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="1"
    opacity="0.25"
  />

  <!-- Main diamond filled -->
  <polygon
    points="100,38 162,100 100,162 38,100"
    fill="url(#goldGrad)"
    filter="url(#glow)"
  />

  <!-- Inner diamond cut -->
  <polygon
    points="100,58 142,100 100,142 58,100"
    fill="#0a0a0a"
  />

  <!-- Center diamond small -->
  <polygon
    points="100,72 128,100 100,128 72,100"
    fill="url(#goldGrad2)"
  />

  <!-- Tiny center -->
  <polygon
    points="100,86 114,100 100,114 86,100"
    fill="#0a0a0a"
  />

  <!-- Corner dots -->
  <circle cx="100" cy="10" r="2" fill="#c9a84c" opacity="0.6"/>
  <circle cx="190" cy="100" r="2" fill="#c9a84c" opacity="0.6"/>
  <circle cx="100" cy="190" r="2" fill="#c9a84c" opacity="0.6"/>
  <circle cx="10" cy="100" r="2" fill="#c9a84c" opacity="0.6"/>
</svg>
